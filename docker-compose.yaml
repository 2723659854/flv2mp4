version: '3'

services:

  php:

    container_name: php81_h264

    restart: always

    image: rtmp_server_php

    build:

      context: ./

      dockerfile: Dockerfile

    ports:
      # http-flv/ws-flv
      - "8601:8601"
      - "8602:8602"
      - "8603:8603"
    volumes:
      - ./:/usr/src/myapp

    tty: true

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    sysctls:
      net.core.somaxconn: 65535
      net.ipv4.tcp_max_syn_backlog: 65535
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_fin_timeout: 15

networks:
  bridge:
    driver: host
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
